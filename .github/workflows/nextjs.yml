# Builds the static export and publishes it to GitHub Pages.
#
# The site is a Next.js `output: 'export'` build. Pages serves project sites from
# /<repo>/, so the build runs with NEXT_PUBLIC_BASE_PATH set; next.config.mjs and
# scripts/post-build.mjs both read it. Vercel builds the same tree with the
# variable unset and gets a root-relative site.

name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Pages publishes this repo at <domain>/hvac-riyadh/.
  NEXT_PUBLIC_BASE_PATH: ""
  NEXT_PUBLIC_SITE_URL: https://www.hvacriyadh.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6
        # No `static_site_generator: next` on purpose: that injects its own
        # basePath and next.config override, which conflicts with ours.

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # `npm run build` — not `next build` — so post-build.mjs runs and writes the
      # branded 404, the base-path fixups and the redirect stubs.
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
